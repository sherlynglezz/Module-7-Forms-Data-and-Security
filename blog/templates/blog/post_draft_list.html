{% extends 'blog/base.html' %}

{% block content %}
    <h2>Drafts</h2>

    {% for post in posts %}
        <article class="post">
            <p>Created: {{ post.created_date }}</p>
            <h2>
                <a href="{% url 'post_detail' pk=post.pk %}">
                    {{ post.title }}
                </a>
            </h2>
            <p>{{ post.text|truncatewords:30 }}</p>
        </article>
    {% empty %}
        <p>No drafts yet.</p>
    {% endfor %}
{% endblock %}
